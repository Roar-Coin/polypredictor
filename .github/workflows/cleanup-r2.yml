# .github/workflows/cleanup-r2.yml
# Engangsopprydding etter kategorifiksen. Kjor FORST med apply = false.
name: cleanup-r2-categories

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Slett faktisk? (false = bare vis)"
        type: boolean
        default: false

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

# Aldri samtidig med en ingest — den skriver til de samme stiene.
concurrency:
  group: polymarket-ingest
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pandas pyarrow boto3 awscli

      - name: Fetch markets.parquet from R2
        run: |
          mkdir -p data
          aws s3 cp "s3://hindsight-data/raw/markets.parquet" data/markets.parquet \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Cleanup
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python cleanup_r2_categories.py --apply
          else
            python cleanup_r2_categories.py
          fi
