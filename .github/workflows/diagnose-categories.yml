# .github/workflows/diagnose-categories.yml
# Engangsprober mot Gamma og CLOB. Ingen R2, ingen skriving.
name: diagnose-categories

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Probe window
        run: python probe_interval.py
